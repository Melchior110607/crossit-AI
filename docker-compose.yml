services:
  # PostgreSQL removed - using Supabase instead! 🚀
  
  redis:
    image: redis:7-alpine
    container_name: crossit-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crossit-backend
    environment:
      # Supabase (replaces PostgreSQL)
      - SUPABASE_URL=${SUPABASE_URL:-https://vtisiosocwfnelxumnji.supabase.co}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      
      # Better Auth (SQLite - kept separate)
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./auth.db}
      
      # Redis for Celery
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/0}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      
      # JWT Secret
      - JWT_SECRET=${JWT_SECRET:-dev-secret-change-in-production}
      
      # Marketplace OAuth - StockX
      - STOCKX_CLIENT_ID=${STOCKX_CLIENT_ID}
      - STOCKX_CLIENT_SECRET=${STOCKX_CLIENT_SECRET}
      - STOCKX_REDIRECT_URI=${STOCKX_REDIRECT_URI}
      
      # Marketplace OAuth - eBay
      - EBAY_APP_ID=${EBAY_APP_ID}
      - EBAY_CERT_ID=${EBAY_CERT_ID}
      - EBAY_DEV_ID=${EBAY_DEV_ID}
      - EBAY_REDIRECT_URI=${EBAY_REDIRECT_URI}
      - EBAY_ENVIRONMENT=${EBAY_ENVIRONMENT:-SANDBOX}
      - EBAY_RU_NAME=${EBAY_RU_NAME}
      
      # Marketplace OAuth - Shopify
      - SHOPIFY_API_KEY=${SHOPIFY_API_KEY}
      - SHOPIFY_API_SECRET=${SHOPIFY_API_SECRET}
      - SHOPIFY_REDIRECT_URI=${SHOPIFY_REDIRECT_URI}
      
      # Marketplace API Keys - Kaufland
      - KAUFLAND_CLIENT_KEY=${KAUFLAND_CLIENT_KEY}
      - KAUFLAND_SECRET_KEY=${KAUFLAND_SECRET_KEY}
      
      # Marketplace OAuth - Etsy
      - ETSY_KEYSTRING=${ETSY_KEYSTRING}
      - ETSY_SHARED_SECRET=${ETSY_SHARED_SECRET}
      
      # OpenAI API (for AI Product Automation)
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_VISION_MODEL=${OPENAI_VISION_MODEL:-gpt-4o}
      - OPENAI_TEXT_MODEL=${OPENAI_TEXT_MODEL:-gpt-4o}
      
      # eBay Finding API (optional - for price research)
      - EBAY_FINDING_APP_ID=${EBAY_FINDING_APP_ID}
      
      - BASE_REDIRECT_URL=${BASE_REDIRECT_URL}
      
      # Other configs
      - DEBUG=${DEBUG:-True}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crossit-celery-worker
    environment:
      # Supabase
      - SUPABASE_URL=${SUPABASE_URL:-https://vtisiosocwfnelxumnji.supabase.co}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      
      # Redis
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/0}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
    volumes:
      - ./backend:/app
    depends_on:
      - redis
      - backend
    command: celery -A app.tasks.celery_app worker --loglevel=info

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crossit-celery-beat
    environment:
      # Supabase
      - SUPABASE_URL=${SUPABASE_URL:-https://vtisiosocwfnelxumnji.supabase.co}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      
      # Redis
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/0}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
    volumes:
      - ./backend:/app
    depends_on:
      - redis
      - backend
    command: celery -A app.tasks.celery_app beat --loglevel=info

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: crossit-frontend
    environment:
      # Supabase
      - NEXT_PUBLIC_SUPABASE_URL=${SUPABASE_URL:-https://vtisiosocwfnelxumnji.supabase.co}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${SUPABASE_KEY}
      
      # Backend API (SANS /api à la fin car le code ajoute déjà /api/...)
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://backend:8000}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      
      # Better Auth OAuth (Google & Microsoft)
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - MICROSOFT_CLIENT_ID=${MICROSOFT_CLIENT_ID}
      - MICROSOFT_CLIENT_SECRET=${MICROSOFT_CLIENT_SECRET}
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    command: npm run dev

volumes:
  redis_data:

